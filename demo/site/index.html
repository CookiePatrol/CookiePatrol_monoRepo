<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookie Patrol 교육용 배송 안내</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #f5f6fa; color: #202124; font-size: 22px; line-height: 1.55; }
    main { max-width: 620px; margin: 4vh auto; padding: 28px; border-radius: 20px; background: white; box-shadow: 0 8px 28px #18233a18; }
    .tag { display: inline-block; padding: 4px 12px; border-radius: 99px; background: #fff1d6; color: #754600; font-size: 16px; font-weight: 700; }
    h1 { font-size: 32px; line-height: 1.25; }
    .fake-link { padding: 16px; border: 2px dashed #b3261e; border-radius: 12px; color: #8c1d18; overflow-wrap: anywhere; }
    .note { margin-top: 28px; padding: 16px; border-radius: 12px; background: #e8f0fe; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">안전한 교육용 시뮬레이션</span>
    <h1>택배 배송 주소 확인 안내</h1>
    <p>주소가 확인되지 않아 배송이 보류됐습니다. 아래 주소는 앱의 경고 기능을 시험하기 위한 가짜 문구입니다.</p>
    <p class="fake-link">확인 주소: http://192.0.2.1/parcel.apk</p>
    <p>이 페이지에는 누를 수 있는 링크, 로그인 칸, 개인정보 입력 칸이 없습니다.</p>
    <aside class="note">Cookie Patrol 데모 페이지입니다. 실제 배송 조회나 앱 다운로드는 제공하지 않습니다.</aside>
  </main>
</body>
</html>
