<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookie Patrol 교육용 경품 광고</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #fff8e1; color: #202124; font-size: 22px; line-height: 1.55; }
    main { max-width: 620px; margin: 4vh auto; padding: 28px; border-radius: 20px; background: white; box-shadow: 0 8px 28px #18233a18; }
    .tag { display: inline-block; padding: 4px 12px; border-radius: 99px; background: #fff1d6; color: #754600; font-size: 16px; font-weight: 700; }
    h1 { font-size: 32px; line-height: 1.25; }
    .ad { margin: 24px 0; padding: 20px; border: 3px solid #d97706; border-radius: 16px; background: #fffbeb; }
    .fake-link { margin-top: 18px; padding: 14px; border: 2px dashed #b3261e; border-radius: 12px; color: #8c1d18; overflow-wrap: anywhere; }
    .note { margin-top: 28px; padding: 16px; border-radius: 12px; background: #e8f0fe; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">안전한 교육용 시뮬레이션</span>
    <h1>광고 속 경품 사기 신호</h1>
    <section class="ad">
      <strong>축하합니다! 경품에 당첨됐어요.</strong>
      <p>지금 확인하지 않으면 당첨 기회가 사라진다고 재촉하는 광고를 흉내 냅니다.</p>
      <p class="fake-link">가짜 확인 주소: bit.ly/reward-check</p>
    </section>
    <p>주소는 화면에 글자로만 표시됩니다. 이 페이지에는 외부 링크나 개인정보 입력 칸이 없습니다.</p>
    <aside class="note">Cookie Patrol 교육용 가짜 광고입니다. 경품·결제·회원가입은 제공하지 않습니다.</aside>
  </main>
</body>
</html>
