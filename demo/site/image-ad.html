<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookie Patrol 교육용 이미지 광고</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #f5f6fa; color: #202124; font-size: 22px; line-height: 1.55; }
    main { max-width: 700px; margin: 4vh auto; padding: 28px; border-radius: 20px; background: white; box-shadow: 0 8px 28px #18233a18; }
    .tag { display: inline-block; padding: 4px 12px; border-radius: 99px; background: #e8f0fe; color: #174ea6; font-size: 16px; font-weight: 700; }
    h1 { font-size: 32px; line-height: 1.25; }
    img { display: block; width: 100%; height: auto; margin: 24px 0; border-radius: 16px; }
    .note { padding: 16px; border-radius: 12px; background: #e8f0fe; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">안전한 교육용 시뮬레이션</span>
    <h1>이미지 안의 광고 문구 검사</h1>
    <img src="/reward-banner.svg" alt="광고 배너 이미지">
    <aside class="note">배너 안의 문구는 이미지에 그려져 있습니다. 화면 감시를 켜면 OCR이 기기 안에서 글자를 읽습니다. 링크는 실제로 연결되지 않습니다.</aside>
  </main>
</body>
</html>
