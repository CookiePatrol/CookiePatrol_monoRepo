<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cookie Patrol 교육용 계정 보안 안내</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #eef2f8; color: #202124; font-size: 22px; line-height: 1.55; }
    main { max-width: 620px; margin: 4vh auto; padding: 28px; border-radius: 20px; background: white; box-shadow: 0 8px 28px #18233a18; }
    .tag { display: inline-block; padding: 4px 12px; border-radius: 99px; background: #e8f0fe; color: #174ea6; font-size: 16px; font-weight: 700; }
    h1 { font-size: 32px; line-height: 1.25; }
    .warning { margin: 24px 0; padding: 18px; border-left: 6px solid #b3261e; background: #fce8e6; }
    .fake-link { padding: 16px; border: 2px dashed #b3261e; border-radius: 12px; color: #8c1d18; overflow-wrap: anywhere; }
    .note { margin-top: 28px; padding: 16px; border-radius: 12px; background: #e8f0fe; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">안전한 교육용 시뮬레이션</span>
    <h1>계정 보안 확인 안내</h1>
    <section class="warning">
      <strong>계정 이용이 제한될 수 있습니다.</strong>
      <p>보안 확인이 필요합니다. 안내 주소를 확인하라는 상황을 연습합니다.</p>
    </section>
    <p class="fake-link">확인 주소: http://192.0.2.2/account.apk</p>
    <p>이 페이지에는 누를 수 있는 링크, 로그인 칸, 비밀번호 입력 칸이 없습니다.</p>
    <aside class="note">가짜 계정 안내입니다. 192.0.2.2는 문서용 예제 주소이며 실제 서비스에 연결되지 않습니다.</aside>
  </main>
</body>
</html>
